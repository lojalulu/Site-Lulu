name: TMP diagnóstico pedidos (apagar depois)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar pedido de teste e ler eventos
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; SM-A546E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36 Instagram 320.0.0.34.109 Android"
          echo "POST pedido teste -> HTTP $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "User-Agent: $UA" -H 'Content-Type: text/plain' --data '{"t":"pedido","loja":"kits","origem":"teste-diag","pedido":"LU000","valor":705.54,"itens":4,"pag":"pix","prod":"449556x2.4019589x2","v":"diagtest01"}' https://luluextra.com/.netlify/functions/evento)"
          sleep 3
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lulu-relatorio" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          HOJE=$(date -u -d '-3 hours' +%F)
          curl -s -H "Authorization: Bearer $TOK" "https://luluextra.com/.netlify/functions/dados?de=2026-11-02&ate=$HOJE" -o r.json -w 'dados HTTP %{http_code}\n'
          python3 - <<'PY'
          import json, collections, datetime
          d = json.load(open("r.json"))
          print("loja:", d.get("loja"), "total:", d.get("total"))
          c = collections.Counter((e["dia"], e["t"], e["loja"], e["origem"], e["pag"]) for e in d["eventos"])
          for k, n in sorted(c.items()): print(k, n)
          print("--- eventos de pedido (sem dado pessoal) ---")
          for e in d["eventos"]:
              if e["t"] == "pedido":
                  h = datetime.datetime.utcfromtimestamp(e["ts"]/1000) - datetime.timedelta(hours=3)
                  print(h.strftime("%d/%m %H:%M"), e["loja"], e["origem"], e["pedido"], e["valor"], e["itens"], e["pag"])
          PY
