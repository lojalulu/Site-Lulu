name: Teste navegador real (temporario)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-navegador.yml']
permissions:
  contents: write
  id-token: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Abrir o site em produção como uma cliente
        run: |
          cat > t.cjs <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36", viewport: { width: 400, height: 860 } });
            const p = await ctx.newPage();
            const erros = []; p.on("pageerror", e => erros.push(e.message));
            const enviados = []; p.on("request", r => { if (r.url().includes("/functions/evento")) enviados.push(r.method()); });
            const resp = []; p.on("response", r => { if (r.url().includes("/functions/evento")) resp.push(r.status()); });
            await p.goto("https://luluextra.com/?origem=teste-navegador", { waitUntil: "networkidle" });
            const cards = await p.locator("[data-action='adicionar']").count();
            await p.waitForTimeout(1500);
            await p.goto("https://luluextra.com/kitavulso/?origem=teste-navegador", { waitUntil: "networkidle" });
            const cards2 = await p.locator("[data-action='adicionar']").count();
            await p.waitForTimeout(1500);
            console.log(`kits produtos=${cards} | avulso produtos=${cards2} | erros JS=${erros.length} ${erros.join(" ; ")} | eventos enviados=${enviados.length} respostas=${resp.join(",")}`);
            await b.close();
          })();
          JS
          node t.cjs | tee resultado.txt
          sleep 5
          HOJE=$(date -u -d '-3 hours' +%F)
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lulu-relatorio" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -s -H "Authorization: Bearer $TOK" "https://luluextra.com/.netlify/functions/dados?de=$HOJE&ate=$HOJE" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("gravados hoje em produção:",d["loja"],d["total"],[(e["t"],e["loja"],e["origem"]) for e in d["eventos"]])' | tee -a resultado.txt
          mv resultado.txt relatorios/teste-navegador.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add relatorios/teste-navegador.txt && git commit -m "resultado teste navegador" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
