name: TEMP previa melhorias IG (apagar)
on:
  push:
    branches: [melhorias-ig-1211]
permissions:
  contents: write
jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install requests Pillow edge-tts gTTS "opencv-python-headless<5"
      - name: Reels (sem publicar)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ""
        run: |
          mkdir -p /tmp/prev
          for cfg in "venda classico 1" "venda vitrine 1" "conteudo pergunta 1" "venda rapido 0"; do
            set -- $cfg
            REEL_MODO=$1 REEL_FORMATO=$2 REEL_NARRAR=$3 python instagram/postar_reel.py --so-gerar > /tmp/prev/log_$1_$2.txt 2>&1 || echo FALHOU >> /tmp/prev/log_$1_$2.txt
            cp instagram/_saida/reel.mp4 /tmp/prev/reel_$1_$2.mp4 || true
            cp instagram/_saida/previa.jpg /tmp/prev/previa_$1_$2.jpg || true
            cp instagram/_saida/briefing.json /tmp/prev/briefing_$1_$2.json || true
          done
      - name: Feed (sem publicar)
        run: |
          for f in vitrine info carrossel_produto novidades; do
            rm -rf /tmp/w && cp -r . /tmp/w && cd /tmp/w
            FORCAR_FEED=1 FORMATO_FEED=$f python instagram/gerar_conteudo.py > /tmp/prev/log_feed_$f.txt 2>&1 || echo FALHOU >> /tmp/prev/log_feed_$f.txt
            mkdir -p /tmp/prev/feed_$f && cp instagram/_saida/carrossel_*.jpg instagram/_saida/post.json /tmp/prev/feed_$f/ 2>/dev/null || true
            cd $GITHUB_WORKSPACE
          done
      - name: Gravar na branch previa-tmp
        run: |
          cd /tmp/prev && git init -q -b previa-tmp && git config user.name bot && git config user.email bot@x
          git add -A && git commit -qm previa
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previa-tmp:previa-tmp
