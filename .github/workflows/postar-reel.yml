name: Postar Reel no Instagram

on:
  schedule:
    - cron: '30 22 * * *'   # 19:30 em Salvador
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Instagram? (false = só gerar a prévia)"
        default: "true"

concurrency:
  group: postar-instagram   # mesmo grupo do post normal: um espera o outro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg e dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install requests Pillow

      - name: Montar e publicar o Reel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUBLICAR: ${{ github.event.inputs.publicar }}
        run: |
          ARGS=""
          if [ "$PUBLICAR" = "false" ]; then ARGS="--so-gerar"; fi
          python instagram/postar_reel.py $ARGS

      - name: Salvar o histórico de Reels
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A instagram/
          git diff --cached --quiet || git commit -m "Atualizar histórico de Reels"
          git pull --rebase origin main
          git push
