name: Postar Reel no Instagram

on:
  schedule:
    # vários horários de reserva: o GitHub às vezes atrasa ou pula execuções agendadas;
    # o robô só publica 1 Reel por dia (ignora as rodadas seguintes se já postou)
    - cron: '30 20 * * *'   # 17:30 Salvador
    - cron: '30 21 * * *'   # 18:30
    - cron: '30 22 * * *'   # 19:30
    - cron: '30 23 * * *'   # 20:30
    - cron: '30 0 * * *'    # 21:30
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Instagram? (false = só gerar a prévia)"
        default: "true"
      auto:
        description: "Disparo automático (respeita a trava de 1 Reel por dia)"
        default: "false"

concurrency:
  group: postar-reel   # grupo próprio: uma rodada do post normal nunca cancela uma do Reel
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg e dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install requests Pillow

      - name: Montar e publicar o Reel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUBLICAR: ${{ github.event.inputs.publicar }}
          AUTO: ${{ github.event.inputs.auto }}
        run: |
          ARGS=""
          if [ "$PUBLICAR" = "false" ]; then ARGS="--so-gerar"; fi
          python instagram/postar_reel.py $ARGS

      - name: Salvar o histórico de Reels
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A instagram/
          git diff --cached --quiet || git commit -m "Atualizar histórico de Reels"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; echo "push falhou, tentando de novo..."; sleep $((i*4)); done

      - name: Avisar no GitHub se o Reel falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Reel falhou em $(date -u -d '-3 hours' +%Y-%m-%d)"
          if [ -z "$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$T" --body "A rodada do Reel falhou. Veja o arquivo instagram/ultimo_erro_reel.txt no repositório. As próximas rodadas do dia tentam de novo."
          fi
