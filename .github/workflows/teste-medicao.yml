name: Teste medicao (temporario)
on:
  push:
    branches: [medicao]
    paths: ['.github/workflows/teste-medicao.yml']
permissions:
  contents: write
  id-token: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: medicao }
      - name: Testar preview
        run: |
          P=https://deploy-preview-3--lojalulu.netlify.app
          {
          echo "teste em $(date -u)"
          for u in / /kitavulso/ /node_modules/jose/package.json /netlify/functions/dados.mjs /package.json; do echo "GET $u -> $(curl -s -o /dev/null -w '%{http_code}' $P$u)"; done
          echo "site tem MEDICAO: $(curl -s $P/ | grep -c MEDICAO:START) / avulso: $(curl -s $P/kitavulso/ | grep -c MEDICAO:START)"
          echo "site tem produtos: $(curl -s $P/ | grep -c PRODUTOS:START)"
          echo "POST evento -> $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'user-agent: Mozilla/5.0 (Linux; Android 14)' -d '{"t":"pedido","loja":"kits","origem":"teste","pedido":"LU999","valor":1500,"itens":4,"pag":"pix","v":"robo"}' $P/.netlify/functions/evento)"
          echo "POST bot -> $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'user-agent: Googlebot' -d '{"t":"visita","loja":"kits"}' $P/.netlify/functions/evento)"
          sleep 3
          HOJE=$(date -u -d '-3 hours' +%F); ONTEM=$(date -u -d '-27 hours' +%F)
          echo "dados SEM token -> $(curl -s -o /dev/null -w '%{http_code}' "$P/.netlify/functions/dados?de=$ONTEM&ate=$HOJE")"
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lulu-relatorio" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -s -H "Authorization: Bearer $TOK" "$P/.netlify/functions/dados?de=$ONTEM&ate=$HOJE" -o r.json -w 'dados COM token OIDC -> %{http_code}\n'
          python3 -c 'import json;d=json.load(open("r.json"));print("loja:",d["loja"],"| total:",d["total"],"| ultimos:",[{k:e[k] for k in ("t","loja","origem","pedido","valor","itens","pag")} for e in d["eventos"][-3:]])' || head -c 300 r.json
          } > resultado-teste-medicao.txt 2>&1
          cat resultado-teste-medicao.txt
          grep -c "eyJ" resultado-teste-medicao.txt && exit 1 || true
      - name: Salvar resultado
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultado-teste-medicao.txt && git commit -m "resultado teste medicao" && git push origin HEAD:medicao
