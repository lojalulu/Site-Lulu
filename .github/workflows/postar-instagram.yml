name: Postar no Instagram (feed + story)

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 em Salvador
    - cron: '0 13 * * *'   # 10:00 em Salvador
    - cron: '0 15 * * *'   # 12:00 em Salvador
    - cron: '0 21 * * *'   # 18:00 em Salvador
    - cron: '30 22 * * *'  # 19:30 em Salvador
    - cron: '0 0 * * *'    # 21:00 em Salvador
  workflow_dispatch:          # "Run workflow" manual OU relógio externo (cron-job.org)
    inputs:
      auto:
        description: "Disparo automático (cron-job.org) — respeita janela e limite de posts do dia"
        default: "false"

concurrency:
  group: postar-instagram
  cancel-in-progress: false   # se dois horários coincidirem por algum motivo, um espera o outro em vez de cancelar

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  janela:
    # TRAVAS das rodadas automáticas (agendamento do GitHub ou cron-job.org com auto=true):
    # 1) só entre 7h e 22h59 de Salvador (o GitHub atrasa rodadas por horas);
    # 2) só posta se o dia está "devendo" post: posts feitos hoje < horários já vencidos
    #    (08:00, 10:00, 12:00, 18:00, 19:30, 21:00). Assim o relógio externo é o principal
    #    e o agendamento do GitHub só cobre um horário que ficou sem post — nunca duplica.
    # Disparo manual (auto=false) ignora as travas.
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.j.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: instagram/historico_postagens.json
          sparse-checkout-cone-mode: false
      - id: j
        env:
          EVENTO: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          agora = datetime.now(timezone.utc) - timedelta(hours=3)   # Salvador
          evento, auto = os.environ["EVENTO"], os.environ.get("AUTO") or ""
          automatico = evento == "schedule" or auto == "true"
          ok = True
          print(f"Salvador agora: {agora:%d/%m %H:%M} | evento: {evento} | auto: {auto}")
          if automatico:
              if agora.hour < 7 or agora.hour > 22:
                  print("Fora da janela 7h-22h59 — NÃO publica."); ok = False
              else:
                  try:
                      h = json.load(open("instagram/historico_postagens.json", encoding="utf-8"))
                  except Exception:
                      h = {}
                  c = h.get("contagem_dia") or {}
                  feitos = c.get("n", 0) if c.get("data") == agora.strftime("%Y-%m-%d") else 0
                  limite = agora + timedelta(minutes=20)   # tolera relógio adiantado
                  minutos = limite.hour * 60 + limite.minute
                  vencidos = sum(1 for s in (480, 600, 720, 1080, 1170, 1260) if s <= minutos)
                  print(f"Posts hoje: {feitos} | horários vencidos: {vencidos}")
                  if feitos >= vencidos:
                      print("Nenhum horário pendente — NÃO publica (evita duplicado)."); ok = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          PY

  postar:
    needs: janela
    if: needs.janela.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow

      - name: Escolher produto e preparar conteúdo (legenda + imagem do Story)
        working-directory: .
        run: python instagram/gerar_conteudo.py

      - name: Publicar a imagem do Story no repositório
        # precisa estar no ar (raw.githubusercontent.com) ANTES de pedir
        # pra Meta buscar essa imagem — por isso esse commit acontece
        # antes de chamar a API, e não junto com o commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          rm -f _tmp_font.ttf instagram/_tmp_font.ttf
          git add -A
          git diff --cached --quiet || git commit -m "Preparar conteúdo do Instagram"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; echo "push falhou, tentando de novo..."; sleep $((i*4)); done

      - name: Esperar a imagem propagar no CDN do GitHub
        run: sleep 15

      - name: Publicar no Instagram (feed + story)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: python instagram/publicar_instagram.py

      - name: Salvar o histórico de postagens
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A instagram/historico_postagens.json instagram/ultimo_erro_post.txt 2>/dev/null || git add -A instagram/
          git diff --cached --quiet || git commit -m "Atualizar histórico de postagens do Instagram"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; echo "push falhou, tentando de novo..."; sleep $((i*4)); done

      - name: Avisar no GitHub se o post falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Post do Instagram falhou em $(date -u -d '-3 hours' +%Y-%m-%d)"
          if [ -z "$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$T" --body "Um post (feed/story) falhou. Veja instagram/ultimo_erro_post.txt no repositório."
          fi

      - name: Reserva do Reel do dia (caso o das 19:30 não tenha saído)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date -u -d '-3 hours' +%H)
          # O Reel principal vem do cron-job.org às 19:30. Aqui é só reserva:
          # a partir das 20h, se o Reel do dia não saiu, o post das 21h dispara.
          if [ "$H" -ge 20 ] && [ "$H" -le 22 ]; then
            gh workflow run postar-reel.yml -f auto=true || echo "não consegui disparar o Reel"
          else
            echo "Reserva do Reel só a partir das 20h (Salvador ${H}h)."
          fi
