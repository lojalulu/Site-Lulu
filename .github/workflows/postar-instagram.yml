name: Postar no Instagram (feed + story)

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 em Salvador
    - cron: '0 13 * * *'   # 10:00 em Salvador
    - cron: '0 15 * * *'   # 12:00 em Salvador
    - cron: '0 21 * * *'   # 18:00 em Salvador
    - cron: '30 22 * * *'  # 19:30 em Salvador
    - cron: '0 0 * * *'    # 21:00 em Salvador
  workflow_dispatch:          # permite clicar em "Run workflow" manualmente

concurrency:
  group: postar-instagram
  cancel-in-progress: false   # se dois horários coincidirem por algum motivo, um espera o outro em vez de cancelar

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow

      - name: Escolher produto e preparar conteúdo (legenda + imagem do Story)
        working-directory: .
        run: python instagram/gerar_conteudo.py

      - name: Publicar a imagem do Story no repositório
        # precisa estar no ar (raw.githubusercontent.com) ANTES de pedir
        # pra Meta buscar essa imagem — por isso esse commit acontece
        # antes de chamar a API, e não junto com o commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          rm -f _tmp_font.ttf instagram/_tmp_font.ttf
          git add -A
          git diff --cached --quiet || git commit -m "Preparar conteúdo do Instagram"
          git pull --rebase origin main
          git push

      - name: Esperar a imagem propagar no CDN do GitHub
        run: sleep 15

      - name: Publicar no Instagram (feed + story)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: python instagram/publicar_instagram.py

      - name: Salvar o histórico de postagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/historico_postagens.json
          git diff --cached --quiet || git commit -m "Atualizar histórico de postagens do Instagram"
          git pull --rebase origin main
          git push
