[build]
  # Só gera deploy quando muda algo do SITE (as 2 lojas, as funções de medição
  # ou o package.json). Os ~10 commits diários dos robôs (Instagram, catálogo
  # JSON etc.) não gastam crédito do Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html kitavulso/index.html privacidade/ netlify/ package.json netlify.toml"

[functions]
  directory = "netlify/functions"

# Arquivos internos que não devem ser servidos como página
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true


[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Endereços curtos com origem (medição): o contador do site lê o ?origem=
[[redirects]]
  from = "/g"
  to = "/?origem=grupo"
  status = 302
  force = true

[[redirects]]
  from = "/bio"
  to = "/?origem=bio"
  status = 302
  force = true

[[redirects]]
  from = "/bio-avulso"
  to = "/kitavulso/?origem=bio"
  status = 302
  force = true


[[redirects]]
  from = "/story"
  to = "/?origem=story"
  status = 302
  force = true

# Link enviado no Direct a quem comenta QUERO nos Reels (funil comenta-e-recebe)
[[redirects]]
  from = "/direct"
  to = "/?origem=direct"
  status = 302
  force = true
