[build]
  # Só gera deploy quando muda algo do SITE (as 2 lojas, as funções de medição
  # ou o package.json). Os ~10 commits diários dos robôs (Instagram, catálogo
  # JSON etc.) não gastam crédito do Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html kitavulso/index.html netlify/ package.json netlify.toml"

[functions]
  directory = "netlify/functions"

# Arquivos internos que não devem ser servidos como página
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

